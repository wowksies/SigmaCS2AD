<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Omnis CS2 — Login</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="https://raw.githubusercontent.com/wowksies/SigmaCS2AD/main/omnislogo.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --p:#8b5cf6;--p2:#a78bfa;--p3:#7c3aed;--p4:#5b21b6;
  --pglow:rgba(139,92,246,0.5);
  --bg:#03020a;--bg2:#07041a;--bg3:#0b0820;--bg4:#100d28;
  --border:rgba(139,92,246,0.12);--borderM:rgba(139,92,246,0.24);--borderH:rgba(139,92,246,0.42);
  --text:#ede9fe;--muted:#4e4268;--muted2:#9183b5;
  --green:#34d399;--red:#f87171;
  --bebas:'Bebas Neue',sans-serif;
  --display:'Syne',sans-serif;
  --body:'DM Sans',sans-serif;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--text);font-family:var(--body);min-height:100vh;display:flex;flex-direction:column;}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.15;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.06'/%3E%3C/svg%3E");}

/* Nav */
.nav-wrap{position:fixed;top:0;left:0;right:0;z-index:800;display:flex;justify-content:center;pointer-events:none;}
.navbar{pointer-events:auto;display:flex;align-items:center;justify-content:space-between;padding:0 52px;width:100%;max-width:1920px;height:76px;background:transparent;font-family:var(--display);border:1px solid transparent;transition:all .4s cubic-bezier(.4,0,.2,1);}
.navbar.sc{height:56px;width:1020px;max-width:96%;padding:0 22px;background:rgba(3,2,10,0.94);backdrop-filter:blur(32px);border-color:var(--border);border-radius:12px;margin-top:12px;box-shadow:0 20px 50px rgba(0,0,0,0.6),0 0 0 1px rgba(139,92,246,0.04) inset;}
.nav-logo{display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--text);}
.nav-logo img{width:28px;height:28px;object-fit:contain;filter:drop-shadow(0 0 10px var(--pglow));}
.nav-brand{font-family:var(--bebas);font-size:1.4rem;letter-spacing:.1em;}
.nav-brand em{background:linear-gradient(135deg,var(--p2),#c4b5fd);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-style:normal;}
.nav-links{display:flex;align-items:center;gap:0;}
.nav-link{padding:6px 12px;border-radius:7px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;color:var(--muted);transition:all .18s;}
.nav-link:hover{color:var(--text);background:rgba(139,92,246,0.08);}
.nav-right{display:flex;align-items:center;gap:6px;}

/* Main */
main{flex:1;display:flex;align-items:center;justify-content:center;padding:120px 24px 60px;position:relative;z-index:1;}
.card{width:100%;max-width:420px;border:1px solid var(--border);border-radius:16px;background:rgba(7,4,26,0.85);backdrop-filter:blur(24px);padding:40px 36px;box-shadow:0 30px 80px rgba(0,0,0,0.5),0 0 0 1px rgba(139,92,246,0.06) inset;}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--p2),transparent);opacity:.6;}
.logo-wrap{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:8px;}
.logo-wrap img{width:40px;height:40px;filter:drop-shadow(0 0 12px var(--pglow));}
.logo-text{font-family:var(--bebas);font-size:1.6rem;letter-spacing:.08em;}
.logo-text em{background:linear-gradient(135deg,var(--p2),#c4b5fd);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-style:normal;}
h1{text-align:center;font-family:var(--display);font-size:1.3rem;font-weight:800;letter-spacing:.02em;margin-bottom:8px;}
.subtitle{text-align:center;font-size:.85rem;color:var(--muted2);margin-bottom:32px;}

/* Form */
.form-group{margin-bottom:20px;}
label{display:block;font-family:var(--display);font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-bottom:8px;}
input{width:100%;height:48px;border:1px solid var(--border);border-radius:10px;background:var(--bg3);padding:0 16px;color:var(--text);font-family:var(--body);font-size:.95rem;transition:all .18s;}
input:focus{outline:none;border-color:var(--p2);box-shadow:0 0 0 3px rgba(139,92,246,0.15);}
input::placeholder{color:var(--muted);}
.btn{width:100%;height:50px;border:none;border-radius:10px;background:var(--p3);color:#fff;font-family:var(--display);font-size:.8rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;transition:all .18s;box-shadow:0 0 20px rgba(124,58,237,0.35);margin-top:8px;}
.btn:hover{background:var(--p);box-shadow:0 0 30px rgba(139,92,246,0.5);}
.btn:disabled{opacity:.6;cursor:not-allowed;}

/* Messages */
.error{background:rgba(248,113,113,0.1);border:1px solid rgba(248,113,113,0.2);border-radius:8px;padding:12px 16px;color:var(--red);font-size:.85rem;margin-bottom:20px;display:none;}
.success{background:rgba(52,211,153,0.1);border:1px solid rgba(52,211,153,0.2);border-radius:8px;padding:12px 16px;color:var(--green);font-size:.85rem;margin-bottom:20px;display:none;}

/* Footer links */
.footer{text-align:center;margin-top:24px;font-size:.8rem;color:var(--muted2);}
.footer a{color:var(--p2);text-decoration:none;font-weight:600;}
.footer a:hover{text-decoration:underline;}

/* Loading */
.spinner{width:18px;height:18px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin 0.8s linear infinite;display:inline-block;margin-right:8px;vertical-align:middle;}
@keyframes spin{to{transform:rotate(360deg);}}

/* Responsive */
@media(max-width:640px){
  .navbar{padding:0 16px;height:64px;}
  .nav-links{display:none;}
  .card{padding:32px 24px;}
}
</style>
</head>
<body>
<div class="nav-wrap">
  <nav class="navbar" id="navbar">
    <a href="/" class="nav-logo">
      <img src="https://raw.githubusercontent.com/wowksies/SigmaCS2AD/main/omnislogo.png" alt="Omnis">
      <span class="nav-brand"><em>OMNIS</em> CS2</span>
    </a>
    <div class="nav-links">
      <a href="/" class="nav-link">Home</a>
      <a href="/register.html" class="nav-link">Register</a>
    </div>
    <div class="nav-right"></div>
  </nav>
</div>

<main>
  <div class="card">
    <div class="logo-wrap">
      <img src="https://raw.githubusercontent.com/wowksies/SigmaCS2AD/main/omnislogo.png" alt="Omnis">
      <span class="logo-text"><em>OMNIS</em> CS2</span>
    </div>
    <h1>Welcome Back</h1>
    <p class="subtitle">Log in to access your account and key.</p>

    <div class="error" id="errorMsg"></div>
    <div class="success" id="successMsg"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="username">Email</label>
        <input type="email" id="username" name="username" placeholder="Your email" required autocomplete="email">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Your password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn" id="submitBtn">Log In</button>
    </form>

    <div class="footer">
      Don't have an account? <a href="/register.html">Register</a>
    </div>
  </div>
</main>

<script>
// Navbar scroll effect
const navbar = document.getElementById('navbar');
window.addEventListener('scroll', () => {
  if (window.scrollY > 20) navbar.classList.add('sc');
  else navbar.classList.remove('sc');
}, { passive: true });

// Initialize Supabase client
const supaClient = window.supabase.createClient(
  'https://euxtyzhcijdpueajvsvd.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV1eHR5emhjaWpkcHVlYWp2c3ZkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczMDkwNTcsImV4cCI6MjA5Mjg4NTA1N30._rARSmYe7Sp40dvccuL-A9ZSnD_BcdFTHX4SXtxxp88'
);

// Form submission
const form = document.getElementById('loginForm');
const submitBtn = document.getElementById('submitBtn');
const errorMsg = document.getElementById('errorMsg');
const successMsg = document.getElementById('successMsg');

function showError(msg) {
  errorMsg.textContent = msg;
  errorMsg.style.display = 'block';
  successMsg.style.display = 'none';
}

function showSuccess(msg) {
  successMsg.textContent = msg;
  successMsg.style.display = 'block';
  errorMsg.style.display = 'none';
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  
  const email = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  
  if (!email || !password) {
    showError('Please enter email and password');
    return;
  }
  
  submitBtn.disabled = true;
  submitBtn.innerHTML = '<span class="spinner"></span>Logging in...';
  
  try {
    // Sign in with Supabase Auth
    const { data, error } = await supaClient.auth.signInWithPassword({
      email: email,
      password: password,
    });
    
    if (error) {
      showError(error.message || 'Login failed. Check your credentials.');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Log In';
      return;
    }
    
    showSuccess('Login successful! Redirecting...');
    // Store session info
    localStorage.setItem('omnis_user', JSON.stringify({
      email: data.user.email,
      id: data.user.id,
      access_token: data.session.access_token
    }));
    // Redirect to user dashboard after 500ms
    setTimeout(() => {
      window.location.href = '/user-dashboard.html';
    }, 500);
    
  } catch (err) {
    showError('Cannot connect to server. Please check your internet or try again later.');
    console.error('Login error:', err);
    submitBtn.disabled = false;
    submitBtn.textContent = 'Log In';
  }
});
</script>
</body>
</html>
